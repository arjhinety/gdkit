# Attestation for expensive gates. Runs only after a required reviewer approves the
# "attestation" environment, which is what releases the signing key.
#
# Setup (owner, once): create the "attestation" environment with required reviewers (the owner),
# restrict it to the main branch, and store the SSH signing private key as the environment secret
# ATTEST_SIGNING_KEY. The public key goes into .gdkit/allowed_signers in the repo.
#
# What this proves: the receipt hash was committed, its inputs match, its result says passed, and the
# owner approved this run in the environment. It does not prove the expensive job ran. That is what the
# reviewer checks.
#
# Two jobs, so repository code never runs where the key is:
# * "validate" installs gdkit and imports the gate registry (repository code). It has no environment,
#   no secret and a read-only token, and it only outputs the receipt hash.
# * "sign" has the environment and the key. It checks out the same commit, runs no repository code
#   (no pip install, no python), re-checks the hash format, signs the tag and pushes it.
# A step in one job cannot change the PATH, environment or files of another job, which is the point.
#
# One tag per receipt: attest/<run_id>/<gate>/<first 16 hex of the receipt hash>, so a re-run gate can be approved
# again. The tag subject is exactly the receipt hash; the body is one line, issues-head: <issue log head | none>,
# which promote requires to still be an entry of the issue log.
name: attest

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Run to attest (directory name under runs/)"
        required: true
        type: string
      gate:
        description: "Expensive gate name whose receipt is attested"
        required: true
        type: string
      registry:
        description: "module:ATTRIBUTE holding the gate registry"
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.receipt.outputs.digest }}
      issues_head: ${{ steps.receipt.outputs.issues_head }}
    env:
      RUN_ID: ${{ inputs.run_id }}
      GATE: ${{ inputs.gate }}
      REGISTRY: ${{ inputs.registry }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the inputs
        run: |
          set -euo pipefail
          case "$RUN_ID" in
            ""|*[!A-Za-z0-9_-]*) echo "refused: run_id may use only letters, digits, '_' and '-'" >&2; exit 1 ;;
          esac
          case "$GATE" in
            ""|*[!A-Za-z0-9_-]*) echo "refused: gate may use only letters, digits, '_' and '-'" >&2; exit 1 ;;
          esac

      - name: Install gdkit
        run: pip install -e .

      - name: Validate the receipt and print its hash
        id: receipt
        run: |
          set -euo pipefail
          DIGEST="$(python -m gdkit.cli --registry "$REGISTRY" attest "runs/$RUN_ID" "$GATE" --project .gdkit/project.yaml)"
          if ! printf '%s' "$DIGEST" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "refused: the receipt hash is not a sha256 hex string" >&2
            exit 1
          fi
          HEAD_LINE="$(python -m gdkit.cli --registry "$REGISTRY" issues-head --project .gdkit/project.yaml)"
          if ! printf '%s' "$HEAD_LINE" | grep -Eq '^(none|[0-9a-f]{64})$'; then
            echo "refused: the issue log head is not none or a sha256 hex string" >&2
            exit 1
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "issues_head=$HEAD_LINE" >> "$GITHUB_OUTPUT"

  sign:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: attestation
    permissions:
      contents: write
    env:
      RUN_ID: ${{ inputs.run_id }}
      GATE: ${{ inputs.gate }}
      DIGEST: ${{ needs.validate.outputs.digest }}
      ISSUES_HEAD: ${{ needs.validate.outputs.issues_head }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Re-check the inputs and the hash
        run: |
          set -euo pipefail
          case "$RUN_ID" in
            ""|*[!A-Za-z0-9_-]*) echo "refused: bad run_id" >&2; exit 1 ;;
          esac
          case "$GATE" in
            ""|*[!A-Za-z0-9_-]*) echo "refused: bad gate" >&2; exit 1 ;;
          esac
          if ! printf '%s' "$DIGEST" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "refused: the receipt hash is not a sha256 hex string" >&2
            exit 1
          fi
          if ! printf '%s' "$ISSUES_HEAD" | grep -Eq '^(none|[0-9a-f]{64})$'; then
            echo "refused: the issue log head is not none or a sha256 hex string" >&2
            exit 1
          fi
          test -f "runs/$RUN_ID/ledger.jsonl" || { echo "refused: runs/$RUN_ID/ledger.jsonl is not committed" >&2; exit 1; }

      - name: Sign and push the attestation tag
        env:
          SIGNING_KEY: ${{ secrets.ATTEST_SIGNING_KEY }}
          PUSH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          KEY_FILE="$RUNNER_TEMP/attest_key"
          trap 'rm -f "$KEY_FILE"' EXIT
          umask 077
          printf '%s\n' "$SIGNING_KEY" > "$KEY_FILE"
          git config user.name "gdkit-attest"
          git config user.email "attest@gdkit.invalid"
          git config gpg.format ssh
          git config user.signingkey "$KEY_FILE"
          TAG="attest/$RUN_ID/$GATE/${DIGEST:0:16}"
          git tag -s "$TAG" -m "$DIGEST" -m "issues-head: $ISSUES_HEAD"
          AUTH="$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin "refs/tags/$TAG"
