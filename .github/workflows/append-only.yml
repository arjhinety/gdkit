# Append-only check for committed run records (see gdkit/append_only.py). Read-only, no secrets.
#
# In gdkit's own repository there is no runs/ folder, so this examines 0 files and only shows the command works.
# It is meant to be copied into a study repository. It only counts as enforcement there when the branch is
# protected and this job is a required check.
name: append-only

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  append-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install gdkit
        run: python -m pip install -e .

      - name: Check that run records only grew
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            BASE="$PR_BASE"
          else
            BASE="$BEFORE"
          fi
          # A branch's first push has no previous commit: compare with where it left the default branch.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="$(git merge-base "origin/$DEFAULT_BRANCH" HEAD)" || { echo "no base commit to compare against" >&2; exit 1; }
          fi
          python -m gdkit.append_only --base "$BASE"
